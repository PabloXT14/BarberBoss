services:
    mysql:
        image: mysql:8.4
        container_name: barberboss-mysql-db
        restart: unless-stopped

        ports:
            - "3306:3306"

        environment:
            MYSQL_DATABASE: barberboss_db
            MYSQL_USER: barberboss_user
            MYSQL_PASSWORD: '@Password123'

        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
